# Pinned toolchain for reproducible releases (docs/RELEASE-PLAN.md §3.1).
#
# Place at the REPO ROOT (not in flasher/) so every cargo invocation picks it up.
#
# NOTE: 1.98.0 is what the maintainer machine currently runs (Homebrew rust). Pinning to a
# Homebrew-managed version is fine for `cargo build`, but rustup must own the toolchain for
# `rustup target add` to work — if `rustup toolchain list` does not show 1.98.0, run
# `rustup toolchain install 1.98.0` first.
#
# UNVERIFIED: the musl and cross targets below were never installed on this machine.

[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
profile = "minimal"
